[project]
name = "aegis-agent-platform"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "celery>=5.5",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "locust>=2.46.3",
    "mypy>=2.2.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# E/F=基础错误  I=import 排序  UP=过时写法升级  B=常见 bug 模式
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# 钉死 first-party：缺省靠"模块文件在不在盘"推断——测试先于生产模块交付时
# aegis 被误判三方（I001 假阳性，M3.4 偏差(22)），且结果进 .ruff_cache 本机 CI 分叉
known-first-party = ["aegis"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
explicit_package_bases = true   # ← 新增：按目录路径推导模块名，允许多目录同名文件（如两个 conftest.py）

[[tool.mypy.overrides]]
module = "celery.*"             # celery 5.5 无 py.typed（m2.10 §7 陷阱 5，实测后加）
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg.*"            # asyncpg 无 py.typed（M3.10③ LISTEN 首次直接 import，实测后加——celery 同款）
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gevent.*"             # gevent 无 py.typed（M5.1 locustfile 直接 import，实测后加——同款）
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"          # async def 的测试函数自动被识别，不用逐个加装饰器
pythonpath = ["."]             # M5.1 D4：tests/loadtest 可 import scripts.loadtest.sse_client（纯函数进 CI）

[tool.importlinter]
root_package = "aegis"

[[tool.importlinter.contracts]]
name = "分层依赖只能向下：api|workers → apps|obs → runtime → gateway → core"
type = "layers"
layers = [
    "aegis.api | aegis.workers",
    "aegis.apps | aegis.obs",
    "aegis.runtime",
    "aegis.gateway",
    "aegis.core",
]
