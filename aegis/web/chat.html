<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Aegis 客服演示</title>
<style>
  /* 单文件无构建链（01 §5）：原生 JS + 最小样式，演示形态不是产品前端 */
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f0f2f5; }
  #wrap { max-width: 760px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; height: 100vh; }
  h1 { font-size: 16px; margin: 4px 0 8px; color: #333; }
  #cfg { display: grid; grid-template-columns: 90px 1fr auto; gap: 6px; margin-bottom: 8px; font-size: 12px; align-items: center; }
  #cfg input, #cfg textarea { width: 100%; font-size: 12px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
  #cfg textarea { height: 34px; resize: vertical; font-family: monospace; }
  #pane { flex: 1; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
  .msg { max-width: 80%; margin: 6px 0; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.5; }
  .user { background: #1677ff; color: #fff; margin-left: auto; }
  .assistant { background: #f5f5f5; color: #222; border: 1px solid #eee; }
  .sys { font-size: 12px; color: #888; text-align: center; margin: 6px 0; }
  #bar { display: flex; gap: 6px; margin-top: 8px; }
  #bar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { padding: 8px 12px; border: none; border-radius: 6px; background: #1677ff; color: #fff; cursor: pointer; font-size: 13px; }
  button.warn { background: #b45309; }
  button.gray { background: #64748b; }
  button:disabled { background: #bbb; cursor: not-allowed; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Aegis 客服演示 <span id="chan" style="font-size:12px;color:#16a34a"></span></h1>
  <div id="cfg">
    <label>Bearer token</label>
    <textarea id="token" placeholder="uv run python scripts/mint_token.py u-a1 的输出粘这里"></textarea>
    <button class="gray" onclick="newSession()">新会话</button>
    <label>会话 id</label>
    <input id="sid" title="可粘入旧会话 id，点【断线重连】以事件流重建历史（页面刷新后续看旧会话的通路）">
    <span></span>
  </div>
  <div id="pane"></div>
  <div id="bar">
    <input id="msg" placeholder="输入消息，回车发送" onkeydown="if(event.key==='Enter')send()">
    <button id="sendBtn" onclick="send()">发送</button>
    <button class="warn" onclick="cancelApproval()">取消审批</button>
    <button class="gray" onclick="simulateDrop()">断线重连</button>
  </div>
</div>
<script>
"use strict";
/* 帧协议消费端（ADR-007/M3.10）：双通道都用 fetch 手写 SSE 解析——
   原生 EventSource 无法带 Authorization 头，原生用法只剩"JWT 进 URL"一条路
   （凭证不进 URL 是安全底线）；故自记 Last-Event-ID + 手动重连循环，
   服务端 id:/Last-Event-ID 协议原样，未来 cookie 认证可切回原生 EventSource。 */

let lastSeq = 0;          // GET 通道帧的 id:（=events.seq）——重连续传游标
let bubble = null;        // 当前 assistant 气泡（token 增量的落点）
let postCtl = null;       // POST 流的 AbortController
let getCtl = null;        // GET 流的 AbortController（非空=重订阅通道在线）

const $ = id => document.getElementById(id);
const auth = () => ({ "Authorization": "Bearer " + $("token").value.trim() });
const sid = () => $("sid").value;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function newSession() {
  stopGet(); if (postCtl) postCtl.abort();
  $("sid").value = "web-" + Math.random().toString(36).slice(2, 10);
  $("pane").innerHTML = ""; lastSeq = 0; bubble = null;
  sys("新会话 " + sid());
}
function sys(text) {
  const div = document.createElement("div"); div.className = "sys"; div.textContent = text;
  $("pane").appendChild(div); $("pane").scrollTop = 1e9;
}
function addBubble(cls, text) {
  const div = document.createElement("div"); div.className = "msg " + cls; div.textContent = text;
  $("pane").appendChild(div); $("pane").scrollTop = 1e9; return div;
}
function setChan(text) { $("chan").textContent = text; }

/* SSE 手写解析（ADR-007 后果栏"几十行"的那几十行）：空行分帧、前缀取行 */
async function readSse(resp, onFrame) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, cut); buf = buf.slice(cut + 2);
      const f = { event: "", data: null, id: null };
      for (const line of block.split("\n")) {
        if (line.startsWith("id: ")) f.id = parseInt(line.slice(4), 10);
        else if (line.startsWith("event: ")) f.event = line.slice(7);
        else if (line.startsWith("data: ")) f.data = JSON.parse(line.slice(6));
      }
      onFrame(f);
    }
  }
}

function handleFrame(f) {
  if (f.id !== null && f.id > lastSeq) lastSeq = f.id;   // 续传游标只认 GET 帧的 id:
  const d = f.data || {};
  switch (f.event) {
    case "user_message":    // 仅 GET 回放在场（(73)）：重建用户侧蓝气泡，重放不再是半边对话
      addBubble("user", d.text); bubble = null; break;
    case "token":
      if (!bubble) bubble = addBubble("assistant", "");
      bubble.textContent += d.text; $("pane").scrollTop = 1e9; break;
    case "message_reset":   // 半句话整条覆盖（ADR-007:33/D11）——重连语义的肉眼面
      if (!bubble) bubble = addBubble("assistant", "");
      bubble.textContent = d.text; sys("↻ 进行中消息已整条重推"); break;
    case "tool_status":
      sys("🔧 " + d.tool_name + " · " + d.status); break;
    case "approval_pending":
      sys("⏳ 待人工审批 " + d.approval_id + "（到期 " + d.expires_at + "）——可取消，或等坐席裁决");
      break;
    case "handoff":
      sys("🎫 已转人工，工单 " + d.ticket_id); break;
    case "done":
      bubble = null;
      sys("✅ " + d.reason + (d.usage ? "（tokens " + d.usage.prompt_tokens + "+" + d.usage.completion_tokens + "）" : ""));
      break;
    case "error":
      bubble = null; sys("❌ " + d.message); break;
  }
}

async function send() {
  const text = $("msg").value.trim();
  if (!text) return;
  $("msg").value = ""; $("sendBtn").disabled = true;
  addBubble("user", text); bubble = null;
  stopGet();                                  // 新一轮 POST 前收掉旧订阅
  postCtl = new AbortController();
  setChan("· POST 流");
  let sawApproval = false, sawDone = false;
  try {
    const resp = await fetch("/v1/chat", {
      method: "POST",
      headers: { ...auth(), "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid(), message: text, cancel_pending_approval: false }),
      signal: postCtl.signal,
    });
    if (resp.status !== 200) {                // 非 200 全发生在流开始之前（状态码分工不变量）
      const body = await resp.json().catch(() => ({}));
      sys("⛔ " + resp.status + " " + (body.detail || ""));
      return;
    }
    await readSse(resp, f => {
      if (f.event === "approval_pending") sawApproval = true;
      if (f.event === "done") sawDone = true;
      handleFrame(f);
    });
    if (sawApproval && !sawDone) {            // 干净挂起：POST 流自然收束——换 GET 通道等续跑
      sys("🔀 挂起：切换到重订阅通道等待审批结果（ADR-007 立项之问）");
      resubscribe(true);
    }
  } catch (e) {
    if (!postCtl.signal.aborted) {
      // M5.4 (77)：真实断线自动换轨——服务端"断连不取消生产者"早就为重连备好了一切，
      // 此前只有演示按钮会 resubscribe，真断线却停在一行警告（客户端未兑现的那一半）
      sys("⚠️ POST 流异常：" + e + "——自动换轨到重订阅通道续收");
      resubscribe(true);
    }
  } finally {
    setChan(""); $("sendBtn").disabled = false;
  }
}

function stopGet() { if (getCtl) { getCtl.abort(); getCtl = null; setChan(""); } }

/* 重订阅通道：rebuild=true 时以事件流重建面板（服务端是唯一事实源的 UI 直译——
   POST 帧不带 seq，中断后无游标可续，只能整段重放；GET 内断线重连有游标则无缝续传） */
async function resubscribe(rebuild) {
  stopGet();
  const ctl = new AbortController(); getCtl = ctl;
  if (rebuild) { $("pane").innerHTML = ""; lastSeq = 0; bubble = null; sys("🔄 重订阅：以事件流重建"); }
  setChan("· 重订阅通道");
  while (getCtl === ctl) {
    try {
      const resp = await fetch("/v1/sessions/" + sid() + "/stream?after_seq=" + lastSeq, {
        headers: { ...auth(), "Last-Event-ID": String(lastSeq) },
        signal: ctl.signal,
      });
      if (resp.status !== 200) { sys("⛔ 重订阅 " + resp.status); break; }
      bubble = null;                          // 回放的 token 是整段消息，各起一个气泡
      let closed = false;
      await readSse(resp, f => { if (f.event === "done" || f.event === "error") closed = true; handleFrame(f); });
      if (closed || getCtl !== ctl) break;    // 正常关流（done/error/直答类静默收束）
      break;
    } catch (e) {
      if (ctl.signal.aborted) return;         // 手动断线/停止：由调用方决定是否重连
      sys("⚠️ 连接中断，1s 后重连（Last-Event-ID=" + lastSeq + "）");
      await sleep(1000);
    }
  }
  if (getCtl === ctl) { getCtl = null; setChan(""); }
}

/* 断线重连演示（验收幕D）：POST 中断=无游标→事件流重建+message_reset 盖半句；
   GET 中断=有游标→after_seq 无缝续传，零重复帧 */
function simulateDrop() {
  if (postCtl && !postCtl.signal.aborted && $("sendBtn").disabled) {
    postCtl.abort(); sys("🔌 已断开 POST 流（半句话在服务端 msgbuf 里）");
    resubscribe(true);
  } else if (getCtl) {
    const seq = lastSeq;
    stopGet(); sys("🔌 已断开重订阅（游标 seq=" + seq + "）");
    resubscribe(false);
  } else {
    sys("当前无在线通道；也可直接重订阅看历史：");
    resubscribe(true);
  }
}

async function cancelApproval() {
  try {
    const resp = await fetch("/v1/chat", {
      method: "POST",
      headers: { ...auth(), "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid(), message: "取消", cancel_pending_approval: true }),
    });
    if (resp.status !== 200) {
      const body = await resp.json().catch(() => ({}));
      sys("⛔ 取消失败 " + resp.status + " " + (body.detail || ""));
      return;
    }
    stopGet();
    await readSse(resp, handleFrame);
  } catch (e) { sys("⚠️ 取消异常：" + e); }
}

newSession();
</script>
</body>
</html>
