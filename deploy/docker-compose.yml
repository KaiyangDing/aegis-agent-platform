name: aegis

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aegis        # 与 config.py 默认连接串一一对应
      POSTGRES_PASSWORD: aegis    # 仅开发环境；生产走 secrets，不写在文件里
      POSTGRES_DB: aegis
    ports:
      # 只绑回环：不写 127.0.0.1 时 Docker 默认绑 0.0.0.0，公共 Wi-Fi 下同网段可直连
      # （审计加固 B）。代码本来就连 localhost，此改动零成本
      - "127.0.0.1:5432:5432"     # 左边=宿主机端口(localhost 连的就是它)，右边=容器内端口
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"     # 同上：Redis 是网关的整个状态平面，绝不暴露到网卡
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 应用四服务（M4.7，#26/#31）：同一镜像不同 command；migrate one-shot 先行，
  # 多副本永不抢迁移；api/worker/beat 一律 unless-stopped（与 pg/redis 同选型同理由：
  # 保住"手动 docker stop 看降级"的演示口径）。环境变量用服务名不是 localhost（§7-1）；
  # 密钥经 env_file 注入运行时、绝不进镜像层。 ----

  migrate:
    build: ..
    image: aegis-app:latest
    container_name: aegis-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      DATABASE_URL_APP: postgresql+asyncpg://aegis_app:aegis_app@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: aegis-app:latest
    # M5.3：去 container_name 与宿主端口映射（M4.7 实测的 --scale 两道拦截在此摘除）；
    # 宿主入口唯一走 nginx 127.0.0.1:8080（T6）
    restart: unless-stopped
    # 优雅停机配套只落配置（评审 C35，验证归 M5.3/M5.4）
    command:
      [
        "uvicorn",
        "aegis.api.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--timeout-graceful-shutdown",
        "10",
      ]
    stop_grace_period: 15s
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      DATABASE_URL_APP: postgresql+asyncpg://aegis_app:aegis_app@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
    env_file: ../.env
    # M5.3：宿主端口映射已摘（M4.7 预埋注记兑现）——多副本互不抢端口，宿主入口唯一走 nginx:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # slim 镜像无 curl：python 一行探 /healthz（plans/m4 §3-2）
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    image: aegis-app:latest
    container_name: aegis-worker
    restart: unless-stopped
    # 容器内 Linux 用默认 prefork（--pool=solo 只是 Windows 本地调试口径，06 §4）
    command: ["celery", "-A", "aegis.workers.celery_app", "worker", "-l", "info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      DATABASE_URL_APP: postgresql+asyncpg://aegis_app:aegis_app@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    image: aegis-app:latest
    container_name: aegis-beat
    restart: unless-stopped
    command: ["celery", "-A", "aegis.workers.celery_app", "beat", "-l", "info"]
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      DATABASE_URL_APP: postgresql+asyncpg://aegis_app:aegis_app@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
    env_file: ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    # M5.3：宿主唯一入口（api 已无宿主端口映射）；SSE 两坑配置在 nginx.conf（ADR-007）；
    # --scale api=N 之后须 `docker compose exec nginx nginx -s reload` 让新副本进解析结果（T5）
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80" # 只绑回环（既有安全口径）
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  redis_data: