# M5.3 水平扩展入口（ADR-007 两坑是本文件的存在理由；样例即口径基准——plans/m5 §4-M5.3 豁免注记）
upstream aegis_api {
    server api:8000;            # Docker 内嵌 DNS 解析 compose 服务名；--scale 后需 nginx -s reload（T5）
}
server {
    listen 80;
    location / {
        proxy_pass http://aegis_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";      # 复用上游 keep-alive
        proxy_buffering off;                 # ADR-007 坑一：不关则 token 攒批，流式失效
        proxy_cache off;
        proxy_read_timeout 3600s;            # ADR-007 坑二：默认 60s 掐断长回复（语义=两次读之间的空闲）
        gzip off;                            # 压缩缓冲同样破坏逐帧送达
    }
}
